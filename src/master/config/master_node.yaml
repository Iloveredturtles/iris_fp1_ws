/master_node:
  ros__parameters:
    arrive_tol_m: 0.5
    max_pwm: 55.0
    min_pwm: 40.0
    mode: follow_lane
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
    rate_hz: 20.0
    start_type_description_service: true
    steer_gain: 25.0
    steer_limit_deg: 45.0
    target_x: 10.0
    target_y: 0.0
    use_sim_time: false
    vision_timeout_s: 0.5
    wheelbase: 2.6

